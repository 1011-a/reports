name: lint

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/lint.yml"

jobs:
  liquid:
    name: Liquid literals in markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run Liquid lint
        run: python3 scripts/lint-liquid.py

  assets:
    name: Orphaned assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run asset-orphan lint
        run: python3 scripts/lint-assets.py

  anchors:
    name: In-site anchor links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run anchor-link lint
        run: python3 scripts/lint-anchors.py

  page_weight:
    name: Asset page-weight budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run page-weight lint
        run: python3 scripts/lint-page-weight.py
